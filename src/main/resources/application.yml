spring:
  application:
    name: neighborshare
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

---
# ======================
# Perfil: DEV
# ======================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/neighborshare_dev}
    username: ${DB_USER:db_user}
    password: ${DB_PASSWORD:db_password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET:neighborshare-items-bucket}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:4566}   # LocalStack
    presigned-url-duration-minutes: 15

---
# ======================
# Perfil: TEST
# ======================
spring:
  config:
    activate:
      on-profile: test
  # Testcontainers + @ServiceConnection cuidam da conexão
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create-drop

---
# ======================
# Perfil: PROD
# ======================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate          # Nunca alterar schema em produção
    show-sql: false

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    endpoint: ${AWS_S3_ENDPOINT:}  # vazio = AWS real
    presigned-url-duration-minutes: 15

# ======================
# Actuator (comum a todos os perfis)
# ======================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: neighborshare-api
      environment: ${SPRING_PROFILES_ACTIVE:dev}
    distribution:
      percentiles-histogram:
        http.server.requests: true